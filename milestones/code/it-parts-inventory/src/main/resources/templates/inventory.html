<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/defaultTemplate}">
<head>
    <meta charset="UTF-8">
    <title>Inventory | IT Parts Inventory Manager</title>
</head>
<body>
<div layout:fragment="content">
    <section class="container py-5" aria-labelledby="inventory-heading">
        <p class="eyebrow">Computer components</p>
        <h1 id="inventory-heading">Parts Inventory</h1>

        <p class="text-secondary"
           th:if="${session.currentUser != null}"
           th:text="${'Welcome, ' + session.currentUser.firstName + '.'}">
            Welcome.
        </p>

        <!-- Displays messages carried through redirects. -->
        <div th:if="${successMessage != null}"
             class="alert alert-success" role="status"
             th:text="${successMessage}"></div>

        <div th:if="${errorMessage != null}"
             class="alert alert-danger" role="alert"
             th:text="${errorMessage}"></div>

        <div class="card border-0 shadow-sm mt-4">
            <div class="card-body p-4">
                <div class="d-flex flex-wrap justify-content-between
                            align-items-center gap-3 mb-3">
                    <h2 class="h4 mb-0">Inventory Overview</h2>
                    <a class="btn btn-accent" th:href="@{/parts/new}">
                        Add Part
                    </a>
                </div>

                <!-- Distinguishes a successful empty result from a failure. -->
                <div th:if="${!loadFailed and #lists.isEmpty(parts)}"
                     class="border rounded p-4 text-center bg-light">
                    <h3 class="h5">No parts saved yet</h3>
                    <p class="text-secondary mb-0">
                        Select Add Part to create your first inventory record.
                    </p>
                </div>

                <div th:if="${!loadFailed and !#lists.isEmpty(parts)}"
                     class="table-responsive">
                    <table class="table table-striped align-middle">
                        <caption>Saved components in the shared inventory.</caption>
                        <thead>
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Part Name</th>
                            <th scope="col">Category</th>
                            <th scope="col">Quantity</th>
                            <th scope="col">Unit Cost (USD)</th>
                            <th scope="col">Storage Location</th>
                            <th scope="col">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="part : ${parts}">
                            <td th:text="${part.partId}"></td>
                            <td th:text="${part.partName}"></td>
                            <td th:text="${part.category}"></td>
                            <td th:text="${part.quantity}"></td>
                            <td th:text="${#numbers.formatDecimal(
                                part.unitCost, 1, 2)}"></td>
                            <td th:text="${part.storageLocation}"></td>
                            <td>
                                <a class="btn btn-sm btn-outline-secondary"
                                   th:href="@{/parts/{id}(id=${part.partId})}"
                                   th:attr="aria-label=${'View ' + part.partName}">
                                    View Details
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <a th:if="${loadFailed}" class="btn btn-outline-secondary"
                   th:href="@{/inventory}">Try Again</a>
            </div>
        </div>
    </section>
</div>
</body>
</html>
