<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${title + ' | IT Parts Inventory Manager'}">
        IT Parts Inventory Manager
    </title>

    <!-- Loads Bootstrap before the application's custom styles. -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet" th:href="@{/css/styles.css}">

    <!-- Enables the responsive navigation menu. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            defer></script>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header th:replace="~{layouts/common :: header}">
        Application navigation
    </header>

    <!-- Each page supplies its own content within this shared layout. -->
    <main id="main-content" class="site-main">
        <div layout:fragment="content">
            Page content
        </div>
    </main>

    <footer th:replace="~{layouts/common :: footer}">
        Application footer
    </footer>
</body>
</html>
