<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/defaultTemplate}">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Login Form</title>
</head>
<body>

    <!-- Places the login form inside the shared layout. -->
    <div layout:fragment="content">
        <form th:action="@{/login/doLogin}"
              th:object="${loginModel}"
              method="post">

            <table class="form-table">
                <tbody>
                    <tr>
                        <td>
                            <label for="username">User Name:</label>
                        </td>
                        <td>
                            <input type="text"
                                   id="username"
                                   class="form-control"
                                   th:field="*{username}">
                        </td>
                        <td class="validation-error"
                            th:if="${#fields.hasErrors('username')}"
                            th:errors="*{username}">
                            User name error
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="password">Password:</label>
                        </td>
                        <td>
                            <input type="password"
                                   id="password"
                                   class="form-control"
                                   th:field="*{password}">
                        </td>
                        <td class="validation-error"
                            th:if="${#fields.hasErrors('password')}"
                            th:errors="*{password}">
                            Password error
                        </td>
                    </tr>

                    <tr>
                        <td colspan="3" class="text-center">
                            <button type="submit" class="btn btn-primary">
                                Login
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- Shows a summary when submitted values fail validation. -->
            <div class="validation-error error-summary mt-3"
                 th:if="${#fields.hasErrors('*')}">
                <p>Please correct the following:</p>
                <ul>
                    <li th:each="error : ${#fields.errors('*')}"
                        th:text="${error}">
                        Validation error
                    </li>
                </ul>
            </div>
        </form>
    </div>

</body>
</html>
