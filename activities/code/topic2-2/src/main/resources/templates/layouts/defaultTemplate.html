<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${title}">CST-339 Activity 2</title>

    <!-- Loads Bootstrap styles for the shared page layout. -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <style>
        /* Leaves room for the footer at the bottom of the screen. */
        body {
            padding-bottom: 100px;
        }

        .validation-error {
            color: #b00020;
        }

        .form-table {
            margin: 0 auto;
        }

        .form-table td {
            padding: 6px;
            text-align: left;
        }

        .error-summary {
            display: inline-block;
            text-align: left;
        }
    </style>

    <!-- Loads jQuery before the Bootstrap scripts. -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"
            defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
            defer></script>
</head>
<body>
    <div class="container text-center">
        <!-- Inserts the common header into each page. -->
        <div th:replace="~{layouts/common :: header}">
            My Header
        </div>

        <!-- Receives the content supplied by the individual page. -->
        <section layout:fragment="content">
            My Body Contents
        </section>

        <!-- Inserts the common footer into each page. -->
        <div th:replace="~{layouts/common :: footer}">
            My Footer
        </div>
    </div>
</body>
</html>
